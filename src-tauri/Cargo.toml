[package]
name = "ferrite-console-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Ferrite Console's Tauri 2 shell: the same web UI, with native transports to come"

[lib]
name = "ferrite_console_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
# The same core the web build runs as wasm: the native transports (serial, BLE) will use it directly.
ferrite-console-core.workspace = true
