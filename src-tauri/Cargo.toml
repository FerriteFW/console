[package]
name = "ferrite-console-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Ferrite Console's Tauri 2 shell: the same web UI, with native cable (serialport) and Bluetooth (btleplug) transports"

[lib]
name = "ferrite_console_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: the debug switch opens the webview's inspector in a release build (debug.rs).
tauri = { version = "2", features = ["devtools"] }
serde.workspace = true
serde_json.workspace = true
# The same core the web build runs as wasm: its link timing (BLE pieces and pacing, the cable rate).
ferrite-console-core.workspace = true
serialport = "4"
btleplug = "0.11"
futures = "0.3"
uuid = "1"
# The Install page's native save dialog for the 4 MB backup (BACKUP-2).
rfd = { version = "0.15", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# rfd needs a backend on Linux: GTK 3, which the webview (WebKitGTK) already brings.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["tokio", "gtk3"] }

# Where this Mac is (CoreLocation): wry passes no geolocation through to WKWebView on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-location = { version = "0.3", features = ["CLLocationManager", "CLLocation"] }
