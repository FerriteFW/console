[workspace]
resolver = "2"
members = ["core", "wasm", "src-tauri"]
default-members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# Ferrite's own link codec, key map and unique-ID text: reused by path, never copied.
ferrite-core = { path = "../ferrite/crates/ferrite-core" }
ferrite-console-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
