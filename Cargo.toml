[workspace]
resolver = "2"
members = ["core", "wasm", "src-tauri"]
default-members = ["core"]

[workspace.package]
version = "0.9.7"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
# Ferrite's own link codec, key map and unique-ID text: reused by path, never copied.
ferrite-core = { path = "../ferrite/crates/ferrite-core" }
# The radio's own channel, zone and settings types, their byte layouts (persist.rs) and its link session (link.rs):
# the demo radio and the write dry-run run ferrite's real radio side.
ferrite-app = { path = "../ferrite/crates/ferrite-app" }
ferrite-ui = { path = "../ferrite/crates/ferrite-ui" }
# The radio's SPI flash store: its record and ring formats and its header, for moving data between layouts
# (LINK-59 – LINK-62; core::migrate) and, in the tests, its simulated flash to mount the result on.
ferrite-store = { path = "../ferrite/crates/ferrite-store" }
ferrite-console-core = { path = "core" }
# Ferrite release images are signed with minisign (Ed25519); Console checks them. No dependencies of its own.
minisign-verify = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Host builds keep line numbers for backtraces, the dependencies no debug info: full debug info grew target/debug
# to 22 GB (Nov 23, 2026). Set `debug = true` locally to see variables in a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The browser's core (scripts/build-wasm.mjs, which also drops the function names): smallest code, 2.6 MB to 1.5 MB
# (749 to 608 KB gzipped). "z" runs slower but far inside what the link needs (measured: a UI round trip 14 to 16 us,
# a readback parse 7 to 11 us, a 1,000-channel write plan 8.5 to 11 ms). Panics already abort on wasm32.
# wasm-opt -Oz was tried: 9% fewer raw bytes, 3% more gzipped.
[profile.wasm]
inherits = "release"
opt-level = "z"
